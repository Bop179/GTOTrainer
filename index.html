<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GTO Trainer</title>
<style>
:root {
  --bg: #0d1712; --felt: #14382a; --felt2: #0f2a20; --panel: #16201b; --line: #2a3a31;
  --text: #e8efe9; --muted: #93a79a;
  --fold: #4a7bd0; --call: #3fae6a; --raise: #e0533d; --allin: #8e2a5c;
  --great: #3fae6a; --ok: #d9a43a; --bad: #e0533d;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.5 -apple-system, system-ui, sans-serif; }
header { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; padding: 12px 16px; border-bottom: 1px solid var(--line); }
header h1 { font-size: 17px; margin: 0 12px 0 0; }
select, button { font: inherit; color: var(--text); background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; }
button { cursor: pointer; }
.menu { position: relative; }
.menu summary { cursor: pointer; list-style: none; border: 1px solid var(--line); border-radius: 8px; padding: 6px 12px; background: var(--panel); }
.menu summary::-webkit-details-marker { display: none; }
.menu[open] summary { border-color: var(--ok); }
.menu > div { position: absolute; top: calc(100% + 6px); left: 0; z-index: 5; width: min(460px, calc(100vw - 32px)); display: grid; gap: 10px; padding: 14px; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; box-shadow: 0 10px 30px #000a; }
.menu label { display: grid; gap: 4px; color: var(--muted); font-size: 13px; }
.menu h4, #bPick h4 { margin: 6px 0; font-size: 11px; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); }
.menu h4 small, #bPick h4 small { text-transform: none; letter-spacing: 0; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chips button { padding: 5px 12px; border-radius: 999px; font-size: 13px; }
.chips button.on { background: var(--ok); border-color: var(--ok); color: #111; font-weight: 600; }
@media (max-width: 600px) { .menu > div { position: fixed; top: auto; left: 16px; right: 16px; width: auto; max-height: 75vh; overflow: auto; } }
.previews { display: flex; flex-wrap: wrap; gap: 6px; }
.previews button { padding: 4px 8px; font-size: 13px; }
dialog { background: var(--panel); color: var(--text); border: 1px solid var(--line); border-radius: 14px; width: min(640px, calc(100% - 32px)); padding: 20px; }
dialog::backdrop { background: #000a; }
#browse { width: min(1100px, calc(100% - 32px)); }
.bwrap { display: flex; flex-wrap: wrap; gap: 24px; align-items: flex-start; } .bwrap > div:first-child { flex: 1; min-width: 300px; }
dialog h2 { margin: 0 0 8px; font-size: 20px; } dialog h2 small { margin-left: 8px; font-size: 14px; font-weight: 400; color: var(--muted); } dialog h3 { margin: 18px 0 6px; font-size: 15px; color: var(--muted); }
dialog table { width: 100%; border-collapse: collapse; font-size: 14px; }
dialog td, dialog th { text-align: left; padding: 5px 4px; border-bottom: 1px solid var(--line); }
dialog td:last-child, dialog th:last-child { text-align: right; white-space: nowrap; }
.dlg-btns { display: flex; justify-content: space-between; margin-top: 18px; }
.dlg-x { position: absolute; top: 16px; right: 16px; }
.drillbar { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; padding: 10px 14px; border: 1px solid var(--ok); border-radius: 10px; background: #d9a43a1a; }
.drillbar[hidden] { display: none; }
.drill { padding: 3px 10px; font-size: 13px; font-weight: 400; }
.stats { margin-left: auto; display: flex; gap: 14px; color: var(--muted); font-variant-numeric: tabular-nums; }
.stats b { color: var(--text); }
main { max-width: 980px; margin: 0 auto; padding: 16px; display: grid; gap: 16px; }
.table { text-align: center; }
.situation { font-size: 18px; margin-bottom: 28px; } /* room for the top seat's cards */
/* seats sit on an ellipse: --c/--s are cos/sin of the seat angle, --r scales toward the centre (bets, dealer button) */
.felt { --rx: 46%; --ry: 41%; position: relative; aspect-ratio: 2 / 1; margin: 12px 2% 64px; font-variant-numeric: tabular-nums; }
.felt::before { content: ""; position: absolute; inset: 4% 3%; border-radius: 50%; background: radial-gradient(ellipse at center, #1f5e42, var(--felt) 55%, var(--felt2)); border: 12px solid #4a2c18; box-shadow: inset 0 0 50px #000a, 0 0 0 2px #6b4527, 0 14px 40px #000a; }
.seat, .bet, .dealer { position: absolute; left: calc(50% + var(--c) * var(--r) * var(--rx)); top: calc(50% + var(--s) * var(--r) * var(--ry)); transform: translate(-50%, -50%); }
.seat { display: flex; flex-direction: column; align-items: center; z-index: 1; transition: opacity .3s; }
.seat.folded { opacity: .5; }
.plate { position: relative; background: #0b130fee; border: 1px solid var(--line); border-radius: 10px; padding: 3px 10px; min-width: 72px; font-size: 12px; line-height: 1.3; }
.plate b { display: block; font-size: 13px; }
.plate span { color: var(--muted); }
.hero .plate { border-color: var(--ok); }
.backs { display: flex; height: 30px; margin-bottom: -8px; }
.backs i { width: 22px; height: 30px; border-radius: 3px; border: 2px solid #eee; background: repeating-linear-gradient(45deg, #b8322a 0 3px, #8f231d 3px 6px); box-shadow: 0 2px 6px #0008; transform: rotate(-6deg); animation: deal .25s ease-out both; }
.backs i + i { margin-left: -8px; transform: rotate(6deg); }
.tag { font-style: normal; font-size: 11px; line-height: 15px; min-height: 17px; font-weight: 700; padding: 1px 8px; border-radius: 999px; margin-top: 3px; background: var(--raise); white-space: nowrap; }
.bet[hidden] { display: none; }
.tag[hidden] { display: block; visibility: hidden; } /* keeps its space, so the name doesn't shift when a tag appears */
.folded .tag { background: #0008; color: var(--muted); }
.bet { display: flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 700; background: #0009; border-radius: 999px; padding: 1px 8px 1px 2px; }
.bet::before, .pot::before { content: ""; width: 12px; height: 12px; border-radius: 50%; background: var(--ok); border: 2px dashed #fff; }
.dealer { width: 20px; height: 20px; border-radius: 50%; background: #fbfbf7; color: #111; font: 700 11px/20px sans-serif; box-shadow: 0 2px 4px #0008; }
.pot { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); display: flex; align-items: center; gap: 6px; background: #0007; border-radius: 999px; padding: 4px 14px; font-size: 14px; }
.cards { display: flex; gap: 6px; justify-content: center; margin-bottom: -10px; }
.card { width: 56px; height: 80px; border-radius: 8px; background: #fbfbf7; color: #111; display: flex; flex-direction: column; align-items: center; justify-content: center; font-weight: 700; font-size: 24px; line-height: 1; box-shadow: 0 6px 18px #0008; animation: deal .25s ease-out both; }
.card:nth-child(2) { animation-delay: .07s; }
.card span { font-size: 20px; }
.card.red { color: #c8281e; }
.still .card, .still .backs i { animation: none; }
.hero.folded .card, .seat.toss .backs i { animation: toss .5s ease-in forwards; }
.bet.fly { animation: fly .45s cubic-bezier(.2, .8, .3, 1); }
.hero.turn .plate { box-shadow: 0 0 0 2px var(--ok), 0 0 14px var(--ok); }
@property --r { syntax: "<number>"; inherits: false; initial-value: 1; } /* lets a bet slide from the seat (--r 1) to its spot */
@keyframes deal { from { transform: translateY(-30px) rotate(-8deg); opacity: 0; } }
@keyframes toss { to { transform: translate(calc(var(--c) * -1 * min(22vw, 230px)), calc(var(--s) * -1 * min(14vw, 130px))) rotate(180deg) scale(.6); opacity: 0; } }
@keyframes fly { from { --r: .95; opacity: 0; } }
@media (max-width: 600px) {
  .felt { --rx: 37%; --ry: 42%; aspect-ratio: 4 / 5; margin: 12px 0 64px; }
  .felt::before { inset: 3% 8%; }
  .plate { min-width: 54px; padding: 2px 6px; font-size: 11px; }
  .card { width: 46px; height: 66px; font-size: 20px; } .card span { font-size: 17px; }
}
.actions { display: flex; gap: 8px; justify-content: center; }
.actions button { flex: 0 1 auto; min-width: 96px; min-height: 64px; padding: 8px 14px; font-size: 15px; font-weight: 600; border: 0; white-space: nowrap; }
.actions button:disabled { opacity: .45; cursor: default; }
/* after you answer each button shows the solver's frequency (and EV when the data has it); yours stays lit and ringed */
.actions button.done:disabled { opacity: .9; }
.actions button.picked { outline: 3px solid #fff; opacity: 1 !important; }
.actions .res { display: block; } .actions .res b { font-size: 20px; line-height: 1.2; } .actions .res small { font-size: 12px; opacity: .9; margin-left: 4px; }
@media (max-width: 600px) { .actions { flex-wrap: wrap; } .actions button { min-width: 0; flex: 1 1 40%; } }
kbd { font-size: 11px; opacity: .7; margin-left: 6px; }
.feedback { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 16px; display: none; gap: 16px; grid-template-columns: 1fr auto; }
.feedback.show { display: grid; }
.verdict { font-size: 20px; font-weight: 700; }
.verdict.great { color: var(--great); } .verdict.ok { color: var(--ok); } .verdict.bad { color: var(--bad); }
.mix { display: flex; height: 10px; border-radius: 5px; overflow: hidden; margin: 8px 0; }
.pills { display: flex; flex-wrap: wrap; gap: 6px; margin: 10px 0; }
.pill { display: inline-flex; align-items: baseline; gap: 6px; font-size: 14px; font-weight: 600; padding: 3px 10px; border-radius: 999px; border: 1px solid var(--c); background: color-mix(in srgb, var(--c) 30%, transparent); color: color-mix(in srgb, var(--c), #fff 75%); }
.range { margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--line); }
.range h4 { margin: 0; font-size: 13px; font-weight: 600; color: var(--muted); }
.why p { margin: 8px 0; }
.why .muted { color: var(--muted); font-size: 13px; }
.grid { display: grid; grid-template-columns: repeat(13, 26px); gap: 1px; font-size: 9px; align-self: start; }
.grid div { height: 26px; display: flex; align-items: center; justify-content: center; border-radius: 2px; color: #fff; text-shadow: 0 0 2px #000; }
.grid div.me { outline: 2px solid #fff; z-index: 1; }
.legend { display: flex; gap: 10px; font-size: 12px; color: var(--muted); margin-top: 6px; flex-wrap: wrap; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 4px; vertical-align: -1px; }
.next { margin: 0 0 4px; }
.board { position: absolute; left: 50%; top: 42%; transform: translate(-50%, -50%); display: flex; gap: 6px; }
.still .card.new { animation: deal .25s ease-out both; }
.situation div:not(:last-child) { font-size: 14px; line-height: 1.5; color: var(--muted); margin-bottom: 4px; }
/* keep the whole table on screen: cap the felt by viewport height (2:1 felt, ~290px of header, text and buttons) */
@media (min-width: 601px) { .felt { max-width: calc((100vh - 290px) * 2); margin-inline: auto; } }
/* wide screens: range chart | table | analysis side by side, so feedback never needs a scroll */
@media (min-width: 1200px) {
  main { max-width: 1600px; grid-template-columns: 360px minmax(0, 1fr) 360px; grid-template-areas: "drill drill drill" "chart table analysis"; align-items: start; }
  .drillbar { grid-area: drill; } .table { grid-area: table; } .chart { grid-area: chart; } .analysis { grid-area: analysis; }
  .feedback, .feedback.show { display: contents; }
  .feedback > div { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 16px; position: sticky; top: 16px; max-height: calc(100vh - 32px); overflow: auto; }
  .feedback:not(.show) > div { visibility: hidden; }
  .why { font-size: 14px; }
  .grid { grid-template-columns: repeat(13, 24px); } .grid div { height: 24px; }
}
@media (max-width: 760px) { .feedback.show { grid-template-columns: 1fr; } .grid { grid-template-columns: repeat(13, minmax(0, 1fr)); } .stats { margin-left: 0; } }
</style>
</head>
<body>
<header>
  <h1>♠ GTO Trainer</h1>
  <details class="menu" id="settings"><summary id="setSum">⚙ Settings</summary>
    <div>
      <div id="chips"></div>
      <label>Volume <input id="vol" type="range" min="0" max="1" step="0.05"></label>
      <div class="previews"><button data-p="great">Correct</button><button data-p="ok">Mixed</button><button data-p="bad">Mistake</button><button data-p="streak">Streak</button><button data-p="shuffle">Shuffle</button><button data-p="deal">Deal</button><button data-p="chip">Chips</button></div>
    </div>
  </details>
  <button id="mute" title="Toggle sound (M)">🔊</button>
  <button id="leakBtn">Leaks</button>
  <button id="browseBtn">Ranges</button>
  <div class="stats"><span>Hands <b id="sHands">0</b></span><span>Accuracy <b id="sAcc">–</b></span><span>Streak <b id="sStreak">0</b></span></div>
</header>
<main>
  <div class="drillbar" id="drillBar" hidden><span id="drillText"></span><button id="stopDrill">Stop drilling</button></div>
  <section class="table">
    <div class="situation" id="situation"></div>
    <div class="felt" id="felt"></div>
    <div class="actions" id="actions"></div>
  </section>
  <section class="feedback" id="feedback">
    <div class="analysis">
      <div class="verdict" id="verdict"></div>
      <button class="next" id="next">Next hand <kbd>Space</kbd></button>
      <div class="why" id="why"></div>
    </div>
    <div class="chart">
      <div class="grid" id="grid"></div>
      <div class="legend"><span><i style="background:var(--raise)"></i>Raise / bet</span><span><i style="background:var(--allin)"></i>All-in</span><span><i style="background:var(--call)"></i>Call / check</span><span><i style="background:var(--fold)"></i>Fold</span></div>
      <div class="range" id="range"></div>
    </div>
  </section>
</main>
<dialog id="browse">
  <h2>Ranges<small id="bSub"></small></h2><button class="dlg-x" id="closeBrowse" autofocus>Close</button>
  <div class="bwrap"><div><div id="bPick"></div><p id="bSit"></p></div>
  <div><div class="grid" id="bGrid"></div><div class="range" id="bRange"></div></div></div>
</dialog>
<dialog id="leaks">
  <h2>Your leaks<small id="leakStats"></small></h2><button class="dlg-x" id="closeLeaks" autofocus>Close</button>
  <div id="leakBody"></div>
  <div class="dlg-btns"><button id="resetProg">Reset progress</button></div>
</dialog>
<script src="data.js"></script>
<script src="data200.js"></script>
<script src="data8.js"></script>
<script src="data6.js"></script>
<script src="river_wasm.js"></script>
<script src="river.js"></script>
<script src="post/index.js"></script><!-- from solver/pull_post.sh; missing = no postflop yet -->
<script src="postflop.js"></script>
<script>
const $ = id => document.getElementById(id);
const RANKS = "AKQJT98765432";
const ORDER = { "6max": ["UTG","HJ","CO","BTN","SB","BB"], "9max": ["UTG","UTG1","UTG2","LJ","HJ","CO","BTN","SB","BB"], "HU": ["SB","BB"] };
const ACTS = ["Allin", "Raise", "Call", "Fold"]; // index matches data.js columns
const COLOR = { Allin: "var(--allin)", Raise: "var(--raise)", Call: "var(--call)", Fold: "var(--fold)" };
const RAISE_NAME = { RFI: "Open", FACINGRFI: "3-bet", FACING3B: "4-bet", FACING4B: "5-bet", FACING5B: "6-bet", FACING6B: "7-bet",
  // limped pots (SB limps, BB to act): the BB's raise is the 2-bet, the SB's re-raise the 3-bet, and so on
  FACINGLIMP: "Raise", LIMP_FACING2B: "3-bet", LIMP_FACING3B: "4-bet", LIMP_FACING4B: "5-bet", LIMP_FACING5B: "6-bet", LIMP_FACING6B: "7-bet",
  // multiway (every game but heads-up): villain is "OPENER+OTHER", where OTHER called the open (FACINGRFI_CALL) or 3-bet it (FACING3B_COLD)
  FACINGRFI_CALL: "Squeeze", FACING3B_COLD: "4-bet",
  // after a squeeze (open, call, raise) or a cold 4-bet (open, 3-bet, raise): the opener with the other player still behind, or,
  // once the opener folds, the caller / 3-bettor. Villain is the two players besides you, in the order they acted.
  FACINGSQZ: "4-bet", FACINGSQZ_CALLER: "4-bet", FACINGC4B: "5-bet", FACINGC4B_3B: "5-bet" };
// what the two villains in a multiway spot did, in order
const MW = { FACINGRFI_CALL: ["open", "call"], FACING3B_COLD: ["open", "3-bet"], FACINGSQZ: ["call", "squeeze"],
  FACINGSQZ_CALLER: ["open", "squeeze"], FACINGC4B: ["3-bet", "cold 4-bet"], FACINGC4B_3B: ["open", "cold 4-bet"] };
const isLimp = node => node.includes("LIMP");
const villains = s => s.villain ? s.villain.split("+") : [];

// ---------- sound (Web Audio synth, no files) ----------
let audio, master, muted = false, pack = "classic", volume = .8;
try { muted = localStorage.getItem("gto-muted") === "1"; pack = localStorage.getItem("gto-pack") || pack; volume = +(localStorage.getItem("gto-vol") ?? volume); } catch {}
function ac() {
  if (!audio) { audio = new AudioContext(); master = audio.createGain(); master.connect(audio.destination); }
  master.gain.value = volume;
  if (audio.state === "suspended") audio.resume();
  return audio;
}
function tone(freq, at, dur, type = "sine", vol = .18, slide) {
  const c = ac(), o = c.createOscillator(), g = c.createGain(), t = c.currentTime + at;
  o.type = type; o.frequency.setValueAtTime(freq, t);
  if (slide) o.frequency.exponentialRampToValueAtTime(slide, t + dur);
  g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + .008); g.gain.exponentialRampToValueAtTime(.001, t + dur);
  o.connect(g).connect(master); o.start(t); o.stop(t + dur);
}
function noise(at, dur, vol = .25, ftype = "highpass", ffreq = 2500, Q = 1, fslide) {
  const c = ac(), n = Math.ceil(c.sampleRate * dur), b = c.createBuffer(1, n, c.sampleRate), d = b.getChannelData(0), t = c.currentTime + at;
  for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n) ** 2;
  const s = c.createBufferSource(), f = c.createBiquadFilter(), g = c.createGain();
  f.type = ftype; f.frequency.setValueAtTime(ffreq, t); f.Q.value = Q; g.gain.value = vol; s.buffer = b;
  if (fslide) f.frequency.exponentialRampToValueAtTime(fslide, t + dur);
  s.connect(f).connect(g).connect(master); s.start(t);
}
// low sine plus a soft octave so the bass still comes through laptop speakers
const sub = (f, at, dur, vol = .3, slide) => { tone(f, at, dur, "sine", vol, slide); tone(f * 2, at, dur * .7, "triangle", vol * .3, slide && slide * 2); };
const bell = (f, at, dur, vol = .12) => [[1, 1], [2.76, .45], [5.4, .25], [8.9, .1]].forEach(([m, v]) => tone(f * m, at, dur / m ** .4, "sine", vol * v));
const pluck = (f, at, vol = .2) => { tone(f, at, .35, "sine", vol); tone(f * 4, at, .08, "sine", vol * .3); };
const arp = (fs, at, step, fn) => fs.forEach((f, i) => fn(f, at + i * step));

// card sounds every pack shares unless it brings its own: filtered noise kept under ~2kHz so it sounds like felt, not hiss
const CARD = {
  deal: () => { noise(0, .1, .35, "bandpass", 1500, .7, 450); noise(.075, .05, .3, "lowpass", 280); }, // slides across the felt, then lands
  shuffle: () => { // riffle, then the deck is squared up
    for (let i = 0; i < 24; i++) noise(i * .016 + Math.random() * .006, .025, .17, "bandpass", 800 + Math.random() * 600, 1);
    noise(.42, .09, .35, "lowpass", 450); noise(.5, .07, .3, "lowpass", 350);
  },
};
const PACKS = {
  classic: { name: "Classic",
    chip: () => { tone(2400, 0, .05, "triangle", .1); tone(3100, .03, .05, "triangle", .07); },
    great: () => { tone(660, .05, .15); tone(990, .14, .25); },
    ok: () => { tone(587, .05, .18, "triangle"); tone(740, .16, .22, "triangle"); },
    bad: () => { tone(196, .05, .2, "square", .06); tone(147, .2, .35, "square", .06); },
    streak: () => arp([523, 659, 784, 1047], .4, .08, (f, t) => tone(f, t, .25, "triangle", .14)) },
  deep: { name: "Deep (bass)",
    deal: () => { noise(0, .1, .35, "lowpass", 900, 1, 250); sub(70, .07, .08, .3, 45); },
    shuffle: () => { for (let i = 0; i < 24; i++) noise(i * .016 + Math.random() * .006, .03, .22, "lowpass", 500 + Math.random() * 300); sub(60, .42, .12, .35, 40); },
    chip: () => { noise(0, .05, .4, "lowpass", 700); sub(180, 0, .09, .2); },
    great: () => { sub(147, .05, .7, .28); sub(220, .14, .8, .22); },
    ok: () => sub(165, .05, .6, .26),
    bad: () => { sub(82, .05, .55, .4, 52); noise(.05, .25, .4, "lowpass", 160); },
    streak: () => arp([98, 147, 196, 294], .4, .11, (f, t) => sub(f, t, .7, .24)) },
  casino: { name: "Casino",
    chip: () => [0, .045, .08].forEach((t, i) => { noise(t, .03, .4, "bandpass", 4800 - i * 500, 9); tone(5400 - i * 400, t, .03, "sine", .04); }),
    great: () => bell(1319, .05, 1.4, .13),
    ok: () => bell(880, .05, .9, .1),
    bad: () => { noise(.05, .18, .35, "lowpass", 260); tone(110, .05, .25, "sine", .3, 55); },
    streak: () => { arp([1047, 1319, 1568, 2093], .4, .12, (f, t) => bell(f, t, 1.1, .08)); [0, .1, .2, .3].forEach(t => noise(.4 + t, .03, .3, "bandpass", 4800, 9)); } },
  arcade: { name: "Arcade (8-bit)",

  `<span class="pill" style="--c:${COLOR[x]}"><span>${label(x, node)}</span><b>${Math.round(mix[x])}%</b></span>`).join("");
// the whole range's action mix, weighted by combos × reach
function rangeMix(rows) {
  let tot = 0; const s = { Allin: 0, Raise: 0, Call: 0, Fold: 0 };
  rows.forEach((row, i) => { const w = COMBOS(HANDS[i]) * row[4]; if (!w) return; tot += w; const m = mixOf(row); ACTS.forEach(a => s[a] += w * m[a] / 100); });
  ACTS.forEach(a => s[a] = tot ? s[a] / tot * 100 : 0); return s;
}
const vsFull = spot => { const [o, w] = villains(spot); return w ? `${o}'s ${MW[spot.node][0]} and ${w}'s ${MW[spot.node][1]}` : `${o}'s ${faced(spot.node)}`; };

// ---------- local, rule-based explanation ----------
function explain(c, mix, picked, grade) {
  const { spot, rows, hand } = c, node = spot.node, L = a => label(a, node);
  const sorted = ACTS.filter(a => mix[a] > 0).sort((x, y) => mix[y] - mix[x]), best = sorted[0], second = sorted[1];
  const aggressive = a => a === "Raise" || a === "Allin";
  const out = [];

  const share = rangeMix(rows), pct = a => Math.round(share[a]);
  const me = chen(hand);
  out.push(`<b>${hand}</b> is ${describe(hand)}.`);

  if (second && mix[second] >= 25)
    out.push(`This is a close spot: the solver splits between ${L(best)} (${Math.round(mix[best])}%) and ${L(second)} (${Math.round(mix[second])}%). Both lines earn about the same, so mixing keeps you hard to read.`);

  const order = ORDER[spot.game] || [], behind = order.length - 1 - order.indexOf(spot.hero);
  if (node === "RFI") {
    const open = pct("Raise") + pct("Allin");
    out.push(`From ${spot.hero} you open about ${open}% of hands with ${behind} player${behind === 1 ? "" : "s"} left to act. ` +
      (behind >= 4 ? "Many players behind means a higher chance someone wakes up with a big hand, so the range is tight."
        : behind <= 2 ? "Few players behind, so stealing the blinds is profitable with a wide range." : "The range widens as fewer players are left to act."));
    if (aggressive(best)) out.push(`${hand} is inside that range: opening often takes the blinds uncontested, and when called you have the initiative${behind <= 3 && spot.hero !== "SB" ? " and position" : ""}.`);
    if (best === "Fold") out.push(`${hand} isn't strong or playable enough to open here; it's below the cutoff for ${spot.hero}.`);
    if (best === "Call") out.push(`Limping lets the SB see a cheap flop with hands that play OK but don't want to face a 3-bet.`);
  } else {
    const [o, w] = villains(spot), vs = vsFull(spot);
    const z = c.z, odds = Math.round(z.toCall / (z.pot + z.toCall) * 100);
    if (node === "FACINGRFI_CALL") out.push(aggressive(best)
      ? `With two players in, a raise here is a <b>squeeze</b>: ${w}'s call mostly caps their range (their best hands would have 3-bet), and the extra money in the pot makes a raise win more when both fold.`
      : `Two players are already in, so a squeeze has more to win than a normal 3-bet and the solver squeezes a bit more often, while calls lean on hands that play well multiway: pairs and suited hands.`);
    if (node === "FACING3B_COLD") out.push(`Facing an open and a 3-bet, only very strong hands continue: you're up against the 3-bettor's range with ${o} still to act behind you. This solve has no cold-call option, so it's 4-bet or fold.`);
    if (node === "FACINGSQZ") out.push(`A squeeze over an open and a call is a strong range, and ${o} can still wake up behind you, so you continue tighter than against a plain 3-bet.`);
    if (node === "FACINGSQZ_CALLER") out.push(`You flatted the open, so your range is capped: your best hands would have 3-bet. With ${o} out it's you against the squeezer, and calls lean on hands that play well after the flop.`);
    if (node === "FACINGC4B") out.push(`A cold 4-bet over a 3-bet is about as strong as a preflop range gets, and ${o} is still behind you, so only the very top of your range goes on.`);
    if (node === "FACINGC4B_3B") out.push(`${w} cold 4-bet into your 3-bet, which is a very strong range. With ${o} out it's heads-up, and only strong hands continue.`);
    if (z.toCall) out.push(`Pot odds: calling ${bb(z.toCall)} to win a ${bb(z.pot)} pot means you need about ${odds}% equity, before accounting for position and how much of that equity you actually realize${z.toCall >= z.heroBehind ? " (this call puts you all-in, so there's nothing left to realize: raw equity is what counts)" : ""}.`);
    if (aggressive(best)) {
      const raisers = rows.map((row, i) => [row, i]).filter(([row]) => row[4] && row[0] + row[1] >= 50).map(([, i]) => chen(HANDS[i])).sort((x, y) => x - y);
      const value = me >= (raisers[Math.floor(raisers.length / 2)] ?? 0);
      if (value) out.push(`${hand} raises <b>for value</b>: it's ahead of most hands that will continue, so you want to build the pot.`);
      else {
        const blk = hand[0] === "A" ? "The ace blocks AA, AK and AQ, so villain is less likely to hold a hand that can continue. "
          : hand[0] === "K" ? "The king blocks KK and AK. " : "";
        out.push(`${hand} raises <b>as a semi-bluff</b>. ${blk}When villain folds you win the pot right away, and when called ${hand.endsWith("s") ? "being suited gives it backup equity" : "it still has some equity"}. Hands like this make better raises than calls because they don't need to win at showdown.`);
      }
      if (best === "Allin" && parseInt(spot.stack) <= 40) out.push(`At ${spot.stack} effective, shoving denies villain's equity and avoids awkward post-flop spots with a high stack-to-pot ratio.`);
    } else if (best === "Call") {
      out.push(node === "FACINGLIMP"
        ? `Checking sees the flop for free, and you'll have position on the SB. ${hand} doesn't gain enough from a raise to build a bigger pot.`
        : spot.hero === "BB" && node === "FACINGRFI"
        ? `In the BB you already have 1bb invested, so you're getting a good price. ${hand} has enough equity to defend, but raising would mostly fold out worse hands and get called by better ones.`
        : `${hand} is too good to fold but not the right hand to raise: calling keeps villain's weaker hands and bluffs in, while a raise would mostly get called by better.`);
      if (hand.length === 2 && RANKS.indexOf(hand[0]) > 7) out.push(`Small pairs mostly play for set value: they want to see a flop cheaply and hit a set about 12% of the time.`);
      else if (/s$/.test(hand) && /connector|one-gapper/.test(describe(hand))) out.push(`Suited connectors and one-gappers play well after the flop thanks to straight and flush draws.`);
    } else if (best === "Fold") {
      out.push(`${hand} doesn't have enough equity or playability against ${vs} range. Continuing loses chips over time, so letting it go is cheapest.`);
    }
  }

  // suited / offsuit contrast
  if (hand.length === 3) {
    const twin = hand.slice(0, 2) + (hand[2] === "s" ? "o" : "s"), tm = mixOf(rows[HANDS.indexOf(twin)]);
    const tb = ACTS.reduce((x, y) => tm[y] > tm[x] ? y : x);
    if (tb !== best && rows[HANDS.indexOf(twin)][4])
      out.push(`~Compare: ${twin} plays ${L(tb)} ${Math.round(tm[tb])}% here. ${hand[2] === "s" ? "Being suited adds about 3% equity and flush potential, which is the difference." : "The suited version plays better because of its flush potential."}`);
  }
  out.push("~Explanations come from simple local rules, not from the solver, so treat them as a guide.");
  return out;
}

const drawGrid = c => $("grid").innerHTML = gridHTML(c.rows, c.spot.node, c.i);
function gridHTML(rows, node, me) {
  return HANDS.map((h, i) => {
    const row = rows[i], m = mixOf(row);
    let at = 0;
    const stops = ACTS.map(a => { const s = `${COLOR[a]} ${at}% ${at + m[a]}%`; at += m[a]; return s; }).join(",");
    const op = row[4] ? .35 + .65 * row[4] : .15;
    return `<div class="${i === me ? "me" : ""}" style="background:linear-gradient(to right,${stops});opacity:${op}" title="${h}: ${ACTS.filter(a => m[a] >= .5).map(a => (node === "POST" ? { Allin: "All-in", Raise: "Bet/raise", Call: "Check/call", Fold: "Fold" }[a] : label(a, node)) + " " + Math.round(m[a]) + "%").join(", ")}">${h}</div>`;
  }).join("");
}
function rangeHTML(sp) {
  const rm = rangeMix(SPOTS[sp.key]);
  return `<h4>Whole range · ${sp.node === "RFI" ? `opening from ${sp.hero}` : `vs ${vsText(sp)}`}</h4>
    <div class="mix">${ACTS.filter(x => rm[x] >= 0.5).map(x => `<div style="background:${COLOR[x]};width:${rm[x]}%"></div>`).join("")}</div>
    <div class="pills">${pills(rm, sp.node)}</div>`;
}

// ---------- range browser: any spot's chart at the current game and stack, without playing a hand ----------
let bKey; // the chart on show
function openBrowse() {
  bKey = st.cur?.spot?.key;
  $("bSub").textContent = `${GAMES[cfg.game]} · ${cfg.stack}`;
  drawBrowse(); $("browse").showModal();
}
// three chip rows: spot type, your seat, who you're up against. Each chip carries the key of the chart it opens,
// keeping as much of the current pick (seat, opponents) as that row allows
function drawBrowse() {
  const g = cfg.game + "/" + cfg.stack, order = ORDER[cfg.game];
  const rank = s => [s.hero, ...villains(s)].reduce((r, p) => r * 10 + order.indexOf(p) + 1, 0); // your seat, then the villains' seats
  const here = ALL.filter(s => s.game + "/" + s.stack === g).sort((a, b) => rank(a) - rank(b) || a.node.localeCompare(b.node));
  const typeOf = s => Object.keys(SPOT_TYPES).find(n => n.split("|").includes(s.node));
  const sp = here.find(s => s.key === bKey) || here[0], type = typeOf(sp);
  bKey = sp.key;
  const best = l => l.find(s => s.hero === sp.hero && s.villain === sp.villain) || l.find(s => s.hero === sp.hero) || l[0];
  const ofType = here.filter(s => typeOf(s) === type), mine = ofType.filter(s => s.hero === sp.hero);
  const types = Object.keys(SPOT_TYPES).map(t => [t, here.filter(s => typeOf(s) === t)]).filter(([, l]) => l.length);
  const row = (title, items) => `<h4>${title}</h4><div class="chips">${items.map(([s, t]) => `<button data-v="${s.key}"${s.key === sp.key ? ' class="on"' : ""}>${t}</button>`).join("")}</div>`;
  $("bPick").innerHTML = row("Spot", types.map(([t, l]) => [l.includes(sp) ? sp : best(l), SPOT_TYPES[t]]))
    + row("Your seat", order.filter(p => ofType.some(s => s.hero === p)).map(p => [p === sp.hero ? sp : best(ofType.filter(s => s.hero === p)), p]))
    + (sp.node === "RFI" ? "" : row("Against", mine.map(s => [s, vsText(s)])));
  $("bSit").textContent = situation(sp);
  $("bGrid").innerHTML = gridHTML(SPOTS[sp.key], sp.node, -1);
  $("bRange").innerHTML = rangeHTML(sp);
}

// ---------- wiring ----------
$("actions").addEventListener("click", e => { const b = e.target.closest("button"); if (b) b.dataset.next !== undefined ? next() : answer(b.dataset.a); });
$("next").onclick = next;
const stopDrill = () => { st.drill = null; drawDrill(); };
$("chips").onclick = e => {
  const b = e.target.closest("button");
  if (!b) return;
  const g = b.parentElement.dataset.g, v = b.dataset.v;
  if (g === "pack") { pack = v; save("gto-pack", v); muted = false; $("mute").textContent = "🔊"; play("great"); return drawSettings(); }
  if (g === "post") cfg.toPost = !cfg.toPost;
  else if (g === "nodes" || g === "pos") cfg[g] = !v ? [] : cfg[g].includes(v) ? cfg[g].filter(x => x !== v) : [...cfg[g], v];
  else cfg[g] = v;
  if (g === "game") { cfg.pos = []; if (!stacksOf(v).includes(cfg.stack)) cfg.stack = stacksOf(v).at(-1); }
  save("gto-cfg", JSON.stringify(cfg)); drawSettings(); stopDrill(); newHand();
};
// click anywhere else closes the menu (composedPath: the clicked chip is already replaced by the redraw)
document.addEventListener("click", e => { if (!e.composedPath().includes($("settings"))) $("settings").open = false; });
$("stopDrill").onclick = () => { stopDrill(); newHand(); };
$("leakBody").onclick = e => {
  const b = e.target.dataset.b;
  if (!b) return;
  const leak = b => { const cut = b.lastIndexOf(" · "); return { spot: b.slice(0, cut), cat: b.slice(cut + 3) }; };
  st.drill = b === "all" ? { label: `all ${leakTop.length} leaks`, leaks: leakTop.map(([x]) => leak(x)), n: 0, right: 0 }
    : { label: b, leaks: [leak(b)], n: 0, right: 0 };
  $("leaks").close(); drawDrill(); newHand();
};
$("vol").value = volume;
const save = (k, v) => { try { localStorage.setItem(k, v); } catch {} };
if (!PACKS[pack]) pack = "classic";
drawSettings();
$("vol").oninput = () => { volume = +$("vol").value; save("gto-vol", volume); if (master) master.gain.value = volume; };
$("vol").onchange = () => play("chip");
document.querySelector(".previews").onclick = e => { const p = e.target.dataset.p; if (p) { const m = muted; muted = false; play(p); muted = m; } };
$("leakBtn").onclick = () => { renderLeaks(); $("resetProg").textContent = "Reset progress"; $("leaks").showModal(); };
$("closeLeaks").onclick = () => $("leaks").close();
$("browseBtn").onclick = openBrowse;
$("bPick").onclick = e => { const v = e.target.closest("button")?.dataset.v; if (v) { bKey = v; drawBrowse(); } };
$("closeBrowse").onclick = () => $("browse").close();
$("resetProg").onclick = () => { // two clicks so one stray click can't wipe your history
  if ($("resetProg").textContent !== "Click again to erase") return $("resetProg").textContent = "Click again to erase";
  prog = { n: 0, log: [], srs: {} }; saveProg(); renderLeaks(); $("resetProg").textContent = "Reset progress";
};
$("mute").onclick = () => {
  muted = !muted; $("mute").textContent = muted ? "🔇" : "🔊";
  try { localStorage.setItem("gto-muted", muted ? "1" : "0"); } catch {}
};
document.addEventListener("keydown", e => {
  if ($("leaks").open || $("browse").open || ["SELECT", "INPUT"].includes(e.target.tagName) || e.metaKey || e.ctrlKey) return;
  const k = e.key.toLowerCase();
  if ((k === " " || k === "enter") && st.cur?.answered) { e.preventDefault(); next(); return; }
  if (k === "m") return $("mute").click();
  const a = /^[1-9]$/.test(k) && document.querySelectorAll("#actions button")[k - 1]?.dataset.a; // 1, 2, 3… left to right, preflop and postflop
  if (a) answer(a);
});
newHand();
</script>
